{"name":"Build Forja APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Unzip project","run":"unzip -q forja-src.zip -d app && ls app"},{"uses":"actions/setup-node@v4","with":{"node-version":"22"}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Install","working-directory":"app","run":"npm ci"},{"name":"Prebuild","working-directory":"app","run":"npx expo prebuild --platform android --no-install","env":{"CI":"1"}},{"name":"Gradle","working-directory":"app/android","run":"./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a"},{"name":"Copy APK","run":"cp app/android/app/build/outputs/apk/release/app-release.apk Forja.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"Forja-apk","path":"Forja.apk"}},{"name":"Release","env":{"GH_TOKEN":"${{ github.token }}"},"run":"gh release create v1.0.${{ github.run_number }} Forja.apk --title \"Forja 1.0.${{ github.run_number }}\" --notes \"APK Android da Forja\""}]}}}
